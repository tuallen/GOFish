[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gofish"
version = "1.0.0"
description = "GOFish: Full Field-of-View Gaussian Splatting and Mesh Extraction"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "torchmetrics",
    "hydra-core>=1.3",
    "omegaconf",
    "numpy",
    "pillow",
    "scikit-learn",
    "addict",
    "rich",
    "piexif",
    "tensorboard",
    "ninja",
    "slangtorch>=1.3",
    "nvidia-ncore>=19",
]

[project.optional-dependencies]
# Evaluation (gofish/eval/) and mesh evaluation protocols.
eval = [
    "opencv-python",
    "open3d>=0.18",
    "scipy",
    "trimesh",
    "matplotlib",
    "pye57",
]

# Install editable, `pip install -e .`: train.py, render.py, mesh.py and configs/ run from the
# repository, and the CUDA sources are compiled on first use from the package directories.
[tool.setuptools.packages.find]
include = ["gofish*", "threedgrut*", "threedgut_tracer*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt", "*.cu", "*.cuh", "*.h", "*.hpp", "*.inl", "*.cpp", "*.slang"]
