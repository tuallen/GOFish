# FullCircle: Insta360 X4 dual fisheye of about 205 degrees, COLMAP OPENCV_FISHEYE, images_4/
# at 720 x 720, prepared by gofish.data.fullcircle.  The tripod test frames are held
# out through dataset.test_list; every other registered frame trains.
defaults:
  - /base_gs
  - /dataset: colmap
  - /initialization: colmap
  - /render: 3dgut
  - _self_
  - /geometry: null  # + Geometry Objective: geometry=sof

seed_initialization: 1234
dataset:
  downsample_factor: 4
  camera_sampler_seed: 771234
  # No measured aperture: each lens is supported on the first monotone branch of
  # its calibrated distortion polynomial.
  camera_domains: []
  test_list: ${path}/test_list.txt
post_processing:
  # Wide-Angle Appearance Modeling: PPISP with 50 radial knots and a 50x50 flat-field grid per camera.
  radial_attenuation_knots: 50
  flatfield_grid: 50
render:
  # Test renders: numpy.rint PNG quantization and rgb * (W_r * W_ff), see configs/render/3dgut.yaml.
  png_rounding: half_even
  wa_order: product
