# Tanks & Temples (GOF preprocessing): PINHOLE, images_2/.
# Pinhole cameras have no calibrated aperture, so the Wide-Angle Appearance Modeling attenuation is W = 1.
defaults:
  - /base_gs
  - /dataset: colmap
  - /initialization: colmap
  - /render: 3dgut
  - _self_
  - /geometry: null  # + Geometry Objective: geometry=sof

seed_initialization: 1234
dataset:
  downsample_factor: 2
  camera_sampler_seed: 771234
