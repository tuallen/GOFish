type: colmap
downsample_factor: 1  # reads images_<factor>/ (or images_<factor>_png/)
test_split_interval: 8  # every 8th frame is held out
test_list: null  # or a file of held-out COLMAP image names, which replaces the interval
camera_sampler_seed: 0  # dedicated seed of the training-view shuffle
load_exif: true  # EXIF exposure prior for PPISP
# Calibrated camera domains: JSON tables in gofish/camera/data/ (or absolute
# paths). A fisheye camera without a record uses the raster pixels on the first
# monotone branch of its distortion polynomial.
camera_domains: []
